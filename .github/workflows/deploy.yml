# Name of your workflow, visible in the GitHub Actions tab
name: Deploy MkDocs Documentation

# Controls when the workflow will run
on:
  push:
    branches:
      - deploy

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Keeping this for general stability, as 3.9.x might be old for some other actions

      - name: Install MkDocs and Material theme dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material
          # --- REMOVE THIS LINE: pip install mkdocs-mermaid2 ---

      - name: Deploy MkDocs to GitHub Pages
        run: mkdocs gh-deploy --force --clean --config-file mkdocs.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}